[package]
name = "frame-relay-wasm"
version = "0.1.0"
edition = "2021"
description = "WASM frame relay logic for CaringMind glasses streaming"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"

[dependencies.web-sys]
version = "0.3"
features = ["WebSocket", "MessageEvent", "BinaryType", "ErrorEvent", "CloseEvent"]

[dependencies.js-sys]
version = "0.3"

[profile.release]
opt-level = "s"
lto = true
