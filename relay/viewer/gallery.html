<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CaringMind — Creator Gallery</title>
  <!--__GALLERY_DATA__-->
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0a0a; color: #e0e0e0;
      font-family: 'SF Mono', 'Menlo', 'Fira Code', monospace;
      min-height: 100vh;
    }
    header {
      padding: 20px 24px 12px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      display: flex; justify-content: space-between; align-items: flex-end;
    }
    .header-left h1 {
      font-size: 16px; font-weight: 600; color: #fff;
      display: flex; align-items: center; gap: 8px;
    }
    .header-left p { font-size: 11px; color: rgba(255,255,255,0.4); margin-top: 4px; }
    .filters { display: flex; gap: 6px; }
    .filter-btn {
      font-family: inherit; font-size: 10px;
      padding: 4px 10px; border-radius: 10px;
      background: rgba(255,255,255,0.06); color: rgba(255,255,255,0.5);
      border: 1px solid rgba(255,255,255,0.1);
      cursor: pointer; transition: all 0.15s ease;
    }
    .filter-btn:hover { background: rgba(255,255,255,0.1); }
    .filter-btn.active {
      background: rgba(0,255,0,0.1); color: #0f0;
      border-color: rgba(0,255,0,0.3);
    }
    #grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 12px; padding: 16px 24px 60px;
    }
    .card {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 8px; overflow: hidden;
      cursor: pointer; transition: all 0.2s ease;
      text-decoration: none; color: inherit; display: block;
      box-shadow: 0 2px 8px rgba(0,0,0,0.4), 0 1px 3px rgba(0,0,0,0.3);
      opacity: 0; transform: translateY(8px);
      animation: cardIn 0.25s ease forwards;
    }
    .card:hover {
      background: rgba(255,255,255,0.08);
      border-color: rgba(255,255,255,0.15);
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(0,0,0,0.6), 0 2px 8px rgba(0,0,0,0.4);
    }
    @keyframes cardIn {
      to { opacity: 1; transform: translateY(0); }
    }
    .card-thumb {
      width: 100%; aspect-ratio: 16/9;
      background: #111; object-fit: cover;
      display: block;
      opacity: 0; transition: opacity 0.3s ease;
    }
    .card-thumb.loaded { opacity: 1; }
    .card-thumb-placeholder {
      width: 100%; aspect-ratio: 16/9;
      background: #111; display: flex;
      align-items: center; justify-content: center;
      color: rgba(255,255,255,0.15); font-size: 11px;
    }
    .card-body { padding: 12px 14px; }
    .card-top {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 8px;
    }
    .card-title { font-size: 13px; font-weight: 600; color: #fff; }
    .badge {
      font-size: 9px; padding: 2px 8px; border-radius: 10px;
      font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px;
    }
    .badge-live {
      background: rgba(0,255,0,0.1); color: #0f0;
      border: 1px solid rgba(0,255,0,0.2);
    }
    .badge-recorded {
      background: rgba(255,180,0,0.1); color: #fb0;
      border: 1px solid rgba(255,180,0,0.2);
    }
    .card-meta {
      display: grid; grid-template-columns: 1fr 1fr;
      gap: 2px 12px; font-size: 11px;
    }
    .card-meta .row { display: flex; justify-content: space-between; }
    .card-meta .label { color: rgba(255,255,255,0.4); }
    .card-meta .value { color: #e0e0e0; font-weight: 500; }
    .card-actions {
      margin-top: 10px; padding-top: 8px;
      border-top: 1px solid rgba(255,255,255,0.06);
      display: flex; gap: 8px;
    }
    .action-btn {
      font-family: inherit; font-size: 10px;
      padding: 4px 12px; border-radius: 6px;
      background: rgba(255,255,255,0.08); color: #e0e0e0;
      border: 1px solid rgba(255,255,255,0.12);
      cursor: pointer; transition: all 0.15s ease;
      text-decoration: none;
    }
    .action-btn:hover { background: rgba(255,255,255,0.15); }
    .action-btn.primary {
      background: rgba(0,255,0,0.1); color: #0f0;
      border-color: rgba(0,255,0,0.2);
    }
    .empty {
      text-align: center; padding: 80px 24px;
      color: rgba(255,255,255,0.3); font-size: 13px;
      grid-column: 1 / -1;
    }
    .empty p { margin-top: 8px; font-size: 11px; }
    #status-bar {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: rgba(0,0,0,0.85); border-top: 1px solid rgba(255,255,255,0.08);
      padding: 8px 24px; font-size: 10px; color: rgba(255,255,255,0.3);
      display: flex; justify-content: space-between;
      backdrop-filter: blur(8px);
    }
    #status-bar a { color: rgba(255,255,255,0.5); text-decoration: none; }
    #status-bar a:hover { color: #fff; }

    /* --- Shared overlay base --- */
    .overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.9); z-index: 100;
      align-items: center; justify-content: center;
      flex-direction: column;
    }
    .overlay.active { display: flex; }
    .overlay .close-btn {
      position: fixed; top: 16px; right: 16px;
      font-size: 20px; color: #fff; background: rgba(255,255,255,0.1);
      border: none; border-radius: 50%; width: 36px; height: 36px;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      z-index: 101;
    }

    /* --- Recorded video overlay --- */
    #videoOverlay video {
      max-width: 90vw; max-height: 85vh; border-radius: 8px;
      box-shadow: 0 16px 48px rgba(0,0,0,0.8);
    }

    /* --- Live stream overlay --- */
    #liveOverlay {
      background: #000;
    }
    #liveOverlay .live-container {
      display: flex; flex-direction: column; align-items: center;
      width: 100%; height: 100%;
    }
    #liveOverlay canvas {
      max-width: 100%; max-height: calc(100vh - 48px); object-fit: contain;
    }
    #liveOverlay .live-hud {
      display: flex; gap: 16px; padding: 8px 16px;
      font-size: 11px; color: rgba(255,255,255,0.6);
      background: rgba(0,0,0,0.8); width: 100%;
      justify-content: center; flex-shrink: 0;
    }
    #liveOverlay .live-hud .val { color: #0f0; font-weight: 600; }
    #liveOverlay .live-hud .audio-val { color: #0ff; }
    .live-unmute {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.6); z-index: 102;
      display: none; align-items: center; justify-content: center;
      cursor: pointer;
    }
    .live-unmute.show { display: flex; }
    .live-unmute div {
      background: rgba(0,0,0,0.85); border: 1px solid rgba(255,255,255,0.3);
      border-radius: 12px; padding: 24px 40px; text-align: center;
    }
    .live-unmute .icon { font-size: 48px; margin-bottom: 8px; }
    .live-unmute .text { font-size: 14px; color: rgba(255,255,255,0.7); }
  </style>
</head>
<body>
  <header>
    <div class="header-left">
      <h1>Creator Gallery</h1>
      <p id="subtitle"></p>
    </div>
    <div class="filters">
      <button class="filter-btn active" data-filter="all">All</button>
      <button class="filter-btn" data-filter="live">Live</button>
      <button class="filter-btn" data-filter="recorded">Recorded</button>
    </div>
  </header>

  <div id="grid"></div>

  <div id="status-bar">
    <span id="last-refresh">Last refresh: --</span>
    <span><a href="/">Directory</a> &middot; <a href="/stats">Stats</a> &middot; Auto-refresh 30s</span>
  </div>

  <!-- Recorded video overlay -->
  <div class="overlay" id="videoOverlay">
    <button class="close-btn" id="closeVideo">&times;</button>
    <video id="videoPlayer" controls autoplay></video>
  </div>

  <!-- Live stream overlay (uses RelayPlayer) -->
  <div class="overlay" id="liveOverlay">
    <button class="close-btn" id="closeLive">&times;</button>
    <div class="live-container">
      <canvas id="liveCanvas"></canvas>
      <div class="live-hud">
        <span>FPS <span class="val" id="lh-fps">--</span></span>
        <span>SIZE <span class="val" id="lh-size">--</span></span>
        <span>LATENCY <span class="val" id="lh-latency">--</span></span>
        <span>AUDIO <span class="audio-val" id="lh-audio">OFF</span></span>
      </div>
    </div>
  </div>

  <!-- Unmute overlay for live audio -->
  <div class="live-unmute" id="liveUnmute" onclick="resumeLiveAudio()">
    <div>
      <div class="icon">&#x1f50a;</div>
      <div class="text">Tap anywhere to enable audio</div>
    </div>
  </div>

  <script src="/relay-player.js"></script>
  <script>
    const grid = document.getElementById("grid");
    const subtitle = document.getElementById("subtitle");
    const lastRefresh = document.getElementById("last-refresh");
    const videoOverlay = document.getElementById("videoOverlay");
    const videoPlayer = document.getElementById("videoPlayer");
    const closeVideoBtn = document.getElementById("closeVideo");
    const liveOverlay = document.getElementById("liveOverlay");
    const liveCanvas = document.getElementById("liveCanvas");
    const closeLiveBtn = document.getElementById("closeLive");
    const liveUnmute = document.getElementById("liveUnmute");

    let allSessions = [];
    let activeFilter = "all";
    let livePlayer = null;

    document.querySelectorAll(".filter-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        activeFilter = btn.dataset.filter;
        renderBatched(filtered());
      });
    });

    closeVideoBtn.addEventListener("click", () => {
      videoOverlay.classList.remove("active");
      videoPlayer.pause();
      videoPlayer.src = "";
    });
    videoOverlay.addEventListener("click", (e) => {
      if (e.target === videoOverlay) closeVideoBtn.click();
    });

    closeLiveBtn.addEventListener("click", () => {
      liveOverlay.classList.remove("active");
      liveUnmute.classList.remove("show");
      if (livePlayer) { livePlayer.disconnect(); livePlayer = null; }
    });
    liveOverlay.addEventListener("click", (e) => {
      if (e.target === liveOverlay) closeLiveBtn.click();
    });

    function filtered() {
      if (activeFilter === "live") return allSessions.filter(s => s.live);
      if (activeFilter === "recorded") return allSessions.filter(s => !s.live);
      return allSessions;
    }

    function formatDuration(ms) {
      if (!ms) return "--";
      const s = Math.floor(ms / 1000);
      if (s < 60) return s + "s";
      const m = Math.floor(s / 60);
      if (m < 60) return m + "m " + (s % 60) + "s";
      return Math.floor(m / 60) + "h " + (m % 60) + "m";
    }

    function formatTime(iso) {
      if (!iso) return "--";
      const d = new Date(iso);
      return d.toLocaleDateString(undefined, { month: "short", day: "numeric" }) +
        " " + d.toLocaleTimeString(undefined, { hour: "2-digit", minute: "2-digit" });
    }

    function playVideo(url) {
      videoPlayer.src = url;
      videoOverlay.classList.add("active");
    }

    function watchLive(sessionId) {
      // Build WebSocket URL from current page origin
      const proto = location.protocol === "https:" ? "wss:" : "ws:";
      const wsUrl = `${proto}//${location.host}/view?session=${encodeURIComponent(sessionId)}`;

      // Destroy previous player if any
      if (livePlayer) { livePlayer.destroy(); livePlayer = null; }

      // Reset HUD
      document.getElementById("lh-fps").textContent = "--";
      document.getElementById("lh-size").textContent = "--";
      document.getElementById("lh-latency").textContent = "--";
      document.getElementById("lh-audio").textContent = "OFF";
      liveUnmute.classList.remove("show");

      // Create new RelayPlayer instance
      livePlayer = new RelayPlayer({
        canvas: liveCanvas,
        onFps: (fps) => document.getElementById("lh-fps").textContent = fps,
        onSize: (w, h) => document.getElementById("lh-size").textContent = `${w}x${h}`,
        onLatency: (ms) => document.getElementById("lh-latency").textContent = `${ms}ms`,
        onAudioState: (state) => document.getElementById("lh-audio").textContent = state,
        onNeedUnmute: () => liveUnmute.classList.add("show"),
      });

      liveOverlay.classList.add("active");
      livePlayer.connect(wsUrl);
    }

    function resumeLiveAudio() {
      if (livePlayer) {
        livePlayer.resumeAudio();
        liveUnmute.classList.remove("show");
      }
    }

    function onThumbLoad(img) { img.classList.add("loaded"); }

    function cardHtml(s, delay) {
      const device = s.device?.deviceName || s.device?.deviceModel || "Unknown Device";
      const wearable = s.device?.wearableType || "";
      const badgeClass = s.live ? "badge-live" : "badge-recorded";
      const badgeText = s.live ? "LIVE" : "RECORDED";
      const cached = s.exportCached ? "cached" : "on-demand";

      const thumb = s.segments > 0
        ? `<img class="card-thumb" src="${s.thumbnailUrl}" alt=""
                onload="onThumbLoad(this)"
                onerror="this.outerHTML='<div class=\\'card-thumb-placeholder\\'>No preview</div>'" loading="lazy">`
        : `<div class="card-thumb-placeholder">No video</div>`;

      return `<div class="card" style="animation-delay:${delay}ms" data-session="${s.sessionId}">
        ${thumb}
        <div class="card-body">
          <div class="card-top">
            <span class="card-title">${device}</span>
            <span class="badge ${badgeClass}">${badgeText}</span>
          </div>
          <div class="card-meta">
            ${wearable ? `<div class="row"><span class="label">Wearable</span><span class="value">${wearable}</span></div>` : ""}
            <div class="row"><span class="label">Duration</span><span class="value">${formatDuration(s.durationMs)}</span></div>
            <div class="row"><span class="label">Started</span><span class="value">${formatTime(s.startedAt)}</span></div>
            <div class="row"><span class="label">Segments</span><span class="value">${s.segments} vid / ${s.audioChunks} aud</span></div>
            <div class="row"><span class="label">MP4</span><span class="value">${cached}</span></div>
            <div class="row"><span class="label">ID</span><span class="value">${s.sessionId.slice(0, 8)}</span></div>
          </div>
          <div class="card-actions">
            ${s.segments > 0 ? `<button class="action-btn primary" onclick="event.stopPropagation(); playVideo('${s.videoUrl}')">Play</button>
            <a class="action-btn" href="${s.videoUrl}" target="_blank" onclick="event.stopPropagation()">Download</a>` : ""}
            ${s.live ? `<button class="action-btn primary" onclick="event.stopPropagation(); watchLive('${s.sessionId}')">Watch Live</button>` : ""}
          </div>
        </div>
      </div>`;
    }

    function updateSubtitle() {
      const live = allSessions.filter(s => s.live).length;
      const total = allSessions.length;
      subtitle.textContent = `${total} session${total !== 1 ? "s" : ""} (${live} live)`;
    }

    const BATCH = 6;

    function renderBatched(sessions) {
      updateSubtitle();
      grid.innerHTML = "";

      if (sessions.length === 0) {
        grid.innerHTML = '<div class="empty">No sessions found<p>Sessions appear here after publishers connect and stream.</p></div>';
        return;
      }

      let i = 0;
      function nextBatch() {
        const frag = document.createDocumentFragment();
        const end = Math.min(i + BATCH, sessions.length);
        for (; i < end; i++) {
          const div = document.createElement("div");
          div.innerHTML = cardHtml(sessions[i], (i % BATCH) * 30);
          frag.appendChild(div.firstElementChild);
        }
        grid.appendChild(frag);
        if (i < sessions.length) requestAnimationFrame(nextBatch);
      }
      nextBatch();
    }

    function ingest(data) {
      allSessions = data;
      renderBatched(filtered());
      lastRefresh.textContent = "Last refresh: " + new Date().toLocaleTimeString();
    }

    // Inline data from server -- renders during page parse, no fetch needed
    if (window.__GALLERY_DATA) {
      ingest(window.__GALLERY_DATA);
    }

    // Background refresh every 30s
    async function refresh() {
      try {
        const res = await fetch("/gallery/api");
        ingest(await res.json());
      } catch (err) {
        console.error(err);
      }
    }
    setInterval(refresh, 30000);
  </script>
</body>
</html>
