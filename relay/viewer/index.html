<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CaringMind</title>
  <!--__GALLERY_DATA__-->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0a0a; color: #e0e0e0;
      font-family: 'SF Mono', 'Menlo', 'Fira Code', monospace;
      min-height: 100vh;
    }

    /* === GALLERY VIEW === */
    #gallery {
      display: flex; flex-direction: column; min-height: 100vh;
    }
    #gallery.hidden { display: none; }
    header {
      padding: 20px 24px 12px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      display: flex; justify-content: space-between; align-items: flex-end;
    }
    .header-left h1 {
      font-size: 16px; font-weight: 600; color: #fff;
      display: flex; align-items: center; gap: 8px;
    }
    .header-left p { font-size: 11px; color: rgba(255,255,255,0.4); margin-top: 4px; }
    .filters { display: flex; gap: 6px; }
    .filter-btn {
      font-family: inherit; font-size: 10px;
      padding: 4px 10px; border-radius: 10px;
      background: rgba(255,255,255,0.06); color: rgba(255,255,255,0.5);
      border: 1px solid rgba(255,255,255,0.1);
      cursor: pointer; transition: all 0.15s ease;
    }
    .filter-btn:hover { background: rgba(255,255,255,0.1); }
    .filter-btn.active {
      background: rgba(0,255,0,0.1); color: #0f0;
      border-color: rgba(0,255,0,0.3);
    }
    #grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 12px; padding: 16px 24px 60px;
    }
    .card {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 8px; overflow: hidden;
      cursor: default; transition: all 0.2s ease;
      box-shadow: 0 2px 8px rgba(0,0,0,0.4);
      opacity: 0; transform: translateY(8px);
      animation: cardIn 0.25s ease forwards;
    }
    .card:hover {
      background: rgba(255,255,255,0.08);
      border-color: rgba(255,255,255,0.15);
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(0,0,0,0.6);
    }
    @keyframes cardIn { to { opacity: 1; transform: translateY(0); } }
    .card-thumb {
      width: 100%; aspect-ratio: 16/9;
      background: #111; object-fit: cover; display: block;
      opacity: 0; transition: opacity 0.3s ease;
    }
    .card-thumb.loaded { opacity: 1; }
    .card-thumb-placeholder {
      width: 100%; aspect-ratio: 16/9;
      background: #111; display: flex;
      align-items: center; justify-content: center;
      color: rgba(255,255,255,0.15); font-size: 11px;
    }
    .card-body { padding: 12px 14px; }
    .card-top {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 8px;
    }
    .card-title { font-size: 13px; font-weight: 600; color: #fff; }
    .badge {
      font-size: 9px; padding: 2px 8px; border-radius: 10px;
      font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px;
    }
    .badge-live { background: rgba(0,255,0,0.1); color: #0f0; border: 1px solid rgba(0,255,0,0.2); }
    .badge-recorded { background: rgba(255,180,0,0.1); color: #fb0; border: 1px solid rgba(255,180,0,0.2); }
    .card-meta {
      display: grid; grid-template-columns: 1fr 1fr;
      gap: 2px 12px; font-size: 11px;
    }
    .card-meta .row { display: flex; justify-content: space-between; }
    .card-meta .label { color: rgba(255,255,255,0.4); }
    .card-meta .value { color: #e0e0e0; font-weight: 500; }
    .card-actions {
      margin-top: 10px; padding-top: 8px;
      border-top: 1px solid rgba(255,255,255,0.06);
      display: flex; gap: 8px;
    }
    .action-btn {
      font-family: inherit; font-size: 10px;
      padding: 4px 12px; border-radius: 6px;
      background: rgba(255,255,255,0.08); color: #e0e0e0;
      border: 1px solid rgba(255,255,255,0.12);
      cursor: pointer; transition: all 0.15s ease;
      text-decoration: none;
    }
    .action-btn:hover { background: rgba(255,255,255,0.15); }
    .action-btn.primary {
      background: rgba(0,255,0,0.1); color: #0f0;
      border-color: rgba(0,255,0,0.2);
    }
    .empty {
      text-align: center; padding: 80px 24px;
      color: rgba(255,255,255,0.3); font-size: 13px;
      grid-column: 1 / -1;
    }
    .empty p { margin-top: 8px; font-size: 11px; }
    #status-bar {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: rgba(0,0,0,0.85); border-top: 1px solid rgba(255,255,255,0.08);
      padding: 8px 24px; font-size: 10px; color: rgba(255,255,255,0.3);
      display: flex; justify-content: space-between;
      backdrop-filter: blur(8px);
    }
    #status-bar a { color: rgba(255,255,255,0.5); text-decoration: none; }
    #status-bar a:hover { color: #fff; }

    /* === LIVE PLAYER (full page overlay) === */
    #livePlayer {
      display: none; position: fixed; inset: 0;
      background: #000; z-index: 100;
      flex-direction: column;
    }
    #livePlayer.active { display: flex; }
    #livePlayer .player-top {
      display: flex; justify-content: space-between; align-items: center;
      padding: 8px 16px; background: rgba(0,0,0,0.8);
      font-size: 11px; color: rgba(255,255,255,0.6); flex-shrink: 0;
    }
    #livePlayer .player-top .val { color: #0f0; font-weight: 600; }
    #livePlayer .player-top .audio-val { color: #0ff; }
    .back-btn {
      font-family: inherit; font-size: 11px;
      background: rgba(255,255,255,0.1); color: #fff;
      border: 1px solid rgba(255,255,255,0.2);
      padding: 4px 12px; border-radius: 6px; cursor: pointer;
    }
    .back-btn:hover { background: rgba(255,255,255,0.2); }
    #livePlayer .player-canvas {
      flex: 1; display: flex; align-items: center; justify-content: center;
      overflow: hidden;
    }
    #livePlayer canvas { max-width: 100%; max-height: 100%; object-fit: contain; }
    #audio-meter {
      display: inline-block; width: 60px; height: 6px;
      background: rgba(255,255,255,0.15); border-radius: 3px;
      vertical-align: middle; margin-left: 4px; overflow: hidden;
    }
    #audio-meter-fill {
      height: 100%; width: 0%; background: #0ff; border-radius: 3px;
      transition: width 0.05s linear;
    }
    #quality-select {
      background: rgba(255,255,255,0.1); color: #fff;
      border: 1px solid rgba(255,255,255,0.3);
      border-radius: 4px; padding: 2px 6px;
      font-size: 11px; font-family: inherit;
    }
    #quality-select option { background: #222; }

    /* === RECORDED VIDEO OVERLAY === */
    #videoPlayer {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.9); z-index: 100;
      align-items: center; justify-content: center;
    }
    #videoPlayer.active { display: flex; }
    #videoPlayer video {
      max-width: 90vw; max-height: 85vh; border-radius: 8px;
      box-shadow: 0 16px 48px rgba(0,0,0,0.8);
    }
    #videoPlayer .close-btn, #livePlayer .close-btn {
      position: fixed; top: 16px; right: 16px;
      font-size: 20px; color: #fff; background: rgba(255,255,255,0.1);
      border: none; border-radius: 50%; width: 36px; height: 36px;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      z-index: 101;
    }

    /* === UNMUTE OVERLAY === */
    #unmute {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.6); z-index: 102;
      display: none; align-items: center; justify-content: center;
      cursor: pointer;
    }
    #unmute.show { display: flex; }
    #unmute div {
      background: rgba(0,0,0,0.85); border: 1px solid rgba(255,255,255,0.3);
      border-radius: 12px; padding: 24px 40px; text-align: center;
    }
    #unmute .icon { font-size: 48px; margin-bottom: 8px; }
    #unmute .text { font-size: 14px; color: rgba(255,255,255,0.7); }

    /* === LOGIN OVERLAY === */
    #loginOverlay {
      position: fixed; inset: 0; z-index: 200;
      background: rgba(0,0,0,0.9);
      display: flex; align-items: center; justify-content: center;
      flex-direction: column; gap: 16px;
    }
    #loginOverlay.hidden { display: none; }
    #loginOverlay h2 { color: #fff; font-size: 18px; font-weight: 600; }
    #loginOverlay p { color: rgba(255,255,255,0.5); font-size: 12px; max-width: 300px; text-align: center; }
    #loginOverlay .g_id_signin { margin-top: 8px; }
  </style>
</head>
<body>
  <!-- LOGIN OVERLAY -->
  <div id="loginOverlay" class="hidden">
    <h2>Sign in to CaringMind</h2>
    <p>Authentication required to view live streams and access stats.</p>
    <div id="g_id_onload"
         data-client_id=""
         data-callback="handleGoogleLogin"
         data-auto_prompt="false">
    </div>
    <div class="g_id_signin" data-type="standard" data-size="large" data-theme="filled_black" data-text="sign_in_with" data-shape="rectangular" data-logo_alignment="left"></div>
  </div>

  <!-- GALLERY -->
  <div id="gallery">
    <header>
      <div class="header-left">
        <h1>CaringMind</h1>
        <p id="subtitle"></p>
      </div>
      <div class="filters">
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="live">Live</button>
        <button class="filter-btn" data-filter="recorded">Recorded</button>
      </div>
    </header>
    <div id="grid"></div>
    <div id="status-bar">
      <span id="last-refresh">--</span>
      <span><a href="/stats">Stats</a> &middot; Auto-refresh 30s</span>
    </div>
  </div>

  <!-- LIVE PLAYER -->
  <div id="livePlayer">
    <div class="player-top">
      <button class="back-btn" onclick="closeLive()">&larr; Back</button>
      <span>FPS <span class="val" id="p-fps">--</span></span>
      <span>SIZE <span class="val" id="p-size">--</span></span>
      <span>LATENCY <span class="val" id="p-latency">--</span></span>
      <span>DROP <span class="val" id="p-drop">--</span></span>
      <span>AUDIO <span class="audio-val" id="p-audio">OFF</span>
        <span id="audio-meter"><span id="audio-meter-fill"></span></span>
      </span>
      <select id="quality-select" onchange="setQuality(this.value)">
        <option value="high">High (30 FPS)</option>
        <option value="medium">Medium (15 FPS)</option>
        <option value="low">Low (8 FPS)</option>
        <option value="mini">Mini (4 FPS)</option>
      </select>
    </div>
    <div class="player-canvas">
      <canvas id="liveCanvas"></canvas>
    </div>
  </div>

  <!-- RECORDED VIDEO -->
  <div id="videoPlayer">
    <button class="close-btn" onclick="closeVideo()">&times;</button>
    <video id="recVideo" controls autoplay></video>
  </div>

  <!-- UNMUTE -->
  <div id="unmute" onclick="resumeAudio()">
    <div>
      <div class="icon">&#x1f50a;</div>
      <div class="text">Tap anywhere to enable audio</div>
    </div>
  </div>

  <script src="/relay-player.js"></script>
  <script>
    // === AUTH ===
    const loginOverlay = document.getElementById("loginOverlay");
    const NO_AUTH = document.documentElement.dataset.noAuth === "1";

    function requireAuth() {
      if (NO_AUTH) return false;
      const token = localStorage.getItem("relay_token");
      if (!token) {
        loginOverlay.classList.remove("hidden");
        return true;
      }
      return false;
    }

    function handleGoogleLogin(response) {
      const token = response.credential;
      localStorage.setItem("relay_token", token);
      loginOverlay.classList.add("hidden");
      // If a session was queued, open it now
      if (window.__pendingSession) {
        watchLive(window.__pendingSession);
        window.__pendingSession = null;
      } else if (!window.__GALLERY_DATA) {
        fetchGallery();
      }
    }
    // Expose globally for GIS callback
    window.handleGoogleLogin = handleGoogleLogin;

    // Set GIS client_id from server-injected config
    (function() {
      const clientId = window.__GOOGLE_CLIENT_ID || "";
      if (clientId) {
        const onload = document.getElementById("g_id_onload");
        if (onload) onload.setAttribute("data-client_id", clientId);
        // Also set it on any gsi divs
        document.querySelectorAll("[data-client_id]").forEach(el => el.setAttribute("data-client_id", clientId));
      }
    })();

    const grid = document.getElementById("grid");
    const subtitle = document.getElementById("subtitle");
    const lastRefresh = document.getElementById("last-refresh");
    const meterFill = document.getElementById("audio-meter-fill");
    let allSessions = [];
    let activeFilter = "all";
    let player = null;

    // === FILTERS ===
    document.querySelectorAll(".filter-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        activeFilter = btn.dataset.filter;
        render(filtered());
      });
    });

    function filtered() {
      if (activeFilter === "live") return allSessions.filter(s => s.live);
      if (activeFilter === "recorded") return allSessions.filter(s => !s.live);
      return allSessions;
    }

    // === FORMAT HELPERS ===
    function fmtDur(ms) {
      if (!ms) return "--";
      const s = Math.floor(ms / 1000);
      if (s < 60) return s + "s";
      const m = Math.floor(s / 60);
      if (m < 60) return m + "m " + (s % 60) + "s";
      return Math.floor(m / 60) + "h " + (m % 60) + "m";
    }
    function fmtTime(iso) {
      if (!iso) return "--";
      const d = new Date(iso);
      return d.toLocaleDateString(undefined, { month: "short", day: "numeric" }) +
        " " + d.toLocaleTimeString(undefined, { hour: "2-digit", minute: "2-digit" });
    }
    function onThumbLoad(img) { img.classList.add("loaded"); }

    // === CARD RENDERING ===
    function cardHtml(s, delay) {
      const device = s.device?.deviceName || s.device?.deviceModel || "Unknown Device";
      const wearable = s.device?.wearableType || "";
      const badgeClass = s.live ? "badge-live" : "badge-recorded";
      const badgeText = s.live ? "LIVE" : "RECORDED";
      const cached = s.exportCached ? "cached" : "on-demand";
      const thumb = s.segments > 0
        ? `<img class="card-thumb" src="${s.thumbnailUrl}" alt=""
                onload="onThumbLoad(this)"
                onerror="this.outerHTML='<div class=\\'card-thumb-placeholder\\'>No preview</div>'" loading="lazy">`
        : `<div class="card-thumb-placeholder">No video</div>`;
      return `<div class="card" style="animation-delay:${delay}ms">
        ${thumb}
        <div class="card-body">
          <div class="card-top">
            <span class="card-title">${device}</span>
            <span class="badge ${badgeClass}">${badgeText}</span>
          </div>
          <div class="card-meta">
            ${wearable ? `<div class="row"><span class="label">Wearable</span><span class="value">${wearable}</span></div>` : ""}
            <div class="row"><span class="label">Duration</span><span class="value">${fmtDur(s.durationMs)}</span></div>
            <div class="row"><span class="label">Started</span><span class="value">${fmtTime(s.startedAt)}</span></div>
            <div class="row"><span class="label">Segments</span><span class="value">${s.segments} vid / ${s.audioChunks} aud</span></div>
            <div class="row"><span class="label">MP4</span><span class="value">${cached}</span></div>
            <div class="row"><span class="label">ID</span><span class="value">${s.sessionId.slice(0, 8)}</span></div>
          </div>
          <div class="card-actions">
            ${s.segments > 0 ? `<button class="action-btn primary" onclick="playVideo('${s.videoUrl}')">Play</button>
            <a class="action-btn" href="${s.videoUrl}" target="_blank">Download</a>` : ""}
            ${s.live ? `<a class="action-btn primary" href="/view?session=${encodeURIComponent(s.sessionId)}">Watch Live</a>` : ""}
          </div>
        </div>
      </div>`;
    }

    const BATCH = 6;
    function render(sessions) {
      const live = allSessions.filter(s => s.live).length;
      subtitle.textContent = `${allSessions.length} session${allSessions.length !== 1 ? "s" : ""} (${live} live)`;
      grid.innerHTML = "";
      if (sessions.length === 0) {
        grid.innerHTML = '<div class="empty">No sessions found<p>Sessions appear after publishers connect and stream.</p></div>';
        return;
      }
      let i = 0;
      function nextBatch() {
        const frag = document.createDocumentFragment();
        const end = Math.min(i + BATCH, sessions.length);
        for (; i < end; i++) {
          const div = document.createElement("div");
          div.innerHTML = cardHtml(sessions[i], (i % BATCH) * 30);
          frag.appendChild(div.firstElementChild);
        }
        grid.appendChild(frag);
        if (i < sessions.length) requestAnimationFrame(nextBatch);
      }
      nextBatch();
    }

    function ingest(data) {
      allSessions = data;
      render(filtered());
      lastRefresh.textContent = new Date().toLocaleTimeString();
    }

    // === LIVE PLAYER ===
    function watchLive(sessionId) {
      // Require auth before connecting
      if (requireAuth()) {
        window.__pendingSession = sessionId;
        return;
      }

      const proto = location.protocol === "https:" ? "wss:" : "ws:";
      const token = localStorage.getItem("relay_token") || "";
      const wsUrl = `${proto}//${location.host}/view?session=${encodeURIComponent(sessionId)}&token=${encodeURIComponent(token)}`;

      if (player) { player.destroy(); player = null; }
      document.getElementById("p-fps").textContent = "--";
      document.getElementById("p-size").textContent = "--";
      document.getElementById("p-latency").textContent = "--";
      document.getElementById("p-drop").textContent = "--";
      document.getElementById("p-audio").textContent = "OFF";
      meterFill.style.width = "0%";
      document.getElementById("unmute").classList.remove("show");

      player = new RelayPlayer({
        canvas: document.getElementById("liveCanvas"),
        onFps: (fps) => document.getElementById("p-fps").textContent = fps,
        onSize: (w, h) => document.getElementById("p-size").textContent = `${w}x${h}`,
        onLatency: (ms) => document.getElementById("p-latency").textContent = `${ms}ms`,
        onDropped: (c) => document.getElementById("p-drop").textContent = c,
        onAudioState: (s) => document.getElementById("p-audio").textContent = s,
        onAudioLevel: (pct) => meterFill.style.width = pct + "%",
        onNeedUnmute: () => document.getElementById("unmute").classList.add("show"),
      });

      document.getElementById("gallery").classList.add("hidden");
      document.getElementById("livePlayer").classList.add("active");
      player.connect(wsUrl);
    }

    function closeLive() {
      document.getElementById("livePlayer").classList.remove("active");
      document.getElementById("unmute").classList.remove("show");
      document.getElementById("gallery").classList.remove("hidden");
      if (player) { player.disconnect(); player = null; }
    }

    function setQuality(preset) { if (player) player.setQuality(preset); }

    function resumeAudio() {
      if (player) {
        player.resumeAudio();
        document.getElementById("unmute").classList.remove("show");
      }
    }

    // === RECORDED VIDEO ===
    function playVideo(url) {
      const v = document.getElementById("recVideo");
      v.src = url;
      document.getElementById("videoPlayer").classList.add("active");
    }
    function closeVideo() {
      const v = document.getElementById("recVideo");
      v.pause(); v.src = "";
      document.getElementById("videoPlayer").classList.remove("active");
    }
    document.getElementById("videoPlayer").addEventListener("click", (e) => {
      if (e.target.id === "videoPlayer") closeVideo();
    });

    // === AUTO-OPEN SESSION ===
    // If server injected __SESSION_ID, auto-open live player
    function autoOpenSession() {
      const sessionId = window.__SESSION_ID
        || new URLSearchParams(location.search).get("session");
      if (sessionId) {
        watchLive(sessionId);
        return true;
      }
      return false;
    }

    // === INIT ===
    if (window.__GALLERY_DATA) ingest(window.__GALLERY_DATA);

    // Auto-open if session ID provided via URL, otherwise show gallery
    if (!autoOpenSession()) {
      // Fetch gallery data if not injected (gallery is public, no auth needed)
      if (!window.__GALLERY_DATA) fetchGallery();
    }

    async function fetchGallery() {
      try {
        const res = await fetch("/gallery/api");
        ingest(await res.json());
      } catch {}
    }

    // Background refresh every 30s
    setInterval(fetchGallery, 30000);
  </script>
</body>
</html>
