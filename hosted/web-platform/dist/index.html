<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CaringMind</title>
  <!-- OAuth disabled: <script src="https://accounts.google.com/gsi/client" async defer></script> -->
  <script type="module" crossorigin src="/assets/main-BMXjOoCb.js"></script>
  <link rel="modulepreload" crossorigin href="/assets/modulepreload-polyfill-B5Qt9EMX.js">
  <link rel="stylesheet" crossorigin href="/assets/main-J_aeh6vp.css">
</head>
<body>
  <!-- LOGIN OVERLAY -->
  <div id="loginOverlay" class="hidden">
    <h2>Sign in to CaringMind</h2>
    <p>Authentication required to view live streams and access stats.</p>
    <!-- OAuth disabled: <div id="g_id_signin"></div> -->
  </div>

  <!-- GALLERY -->
  <div id="gallery">
    <header>
      <div class="header-left">
        <a href="/" class="header-home">CaringMind</a>
        <p id="subtitle"></p>
      </div>
      <div class="filters">
        <button class="filter-btn active" data-filter="all">All</button>
        <!-- "My Sessions" hidden — auth disabled, no ownership -->
        <button class="filter-btn" data-filter="live">Live</button>
        <button class="filter-btn" data-filter="recorded">Recorded</button>
      </div>
      <div id="userInfo"></div>
    </header>
    <div id="grid"></div>
    <div id="status-bar">
      <span id="last-refresh">--</span>
      <span><a href="/stats">Stats</a> &middot; Auto-refresh 30s</span>
    </div>
  </div>

  <!-- SHARE DIALOG -->
  <div id="shareDialog" class="hidden">
    <div class="share-dialog-content">
      <div class="share-dialog-header">
        <h3>Share Session</h3>
        <button id="closeShareDialog" class="close-btn">&times;</button>
      </div>
      <div class="share-dialog-body">
        <div class="share-create-row">
          <select id="shareExpiry">
            <option value="1">1 hour</option>
            <option value="24">1 day</option>
            <option value="168" selected>7 days</option>
            <option value="720">30 days</option>
          </select>
          <button id="shareCreateBtn" class="action-btn primary">Create Link</button>
        </div>
        <div class="share-link-row">
          <input type="text" id="shareLink" readonly placeholder="Share link will appear here">
          <button id="shareCopyBtn" class="action-btn">Copy</button>
        </div>
        <div id="shareTokenList"></div>
      </div>
    </div>
  </div>

  <!-- LIVE PLAYER -->
  <div id="livePlayer">
    <div class="player-header">
      <div class="player-row-primary">
        <div class="player-left">
          <button class="back-btn" id="backBtn">&larr;</button>
          <div id="sessionInfoStrip" class="session-info-inline hidden">
            <span id="si-device" class="si-item"></span>
            <span id="si-wearable" class="si-item"></span>
            <span id="si-uptime" class="si-item">--:--</span>
            <span id="si-viewers" class="si-item"></span>
            <span id="si-recording" class="si-item si-rec hidden"></span>
          </div>
        </div>
        <div class="player-center">
          <span class="stat" id="stat-fps" title="Frames per second">
            <span class="stat-label">FPS</span>
            <span class="stat-val" id="p-fps">--</span>
          </span>
          <span class="stat" id="stat-audio" title="Audio codec">
            <span id="audio-dot" class="audio-dot"></span>
            <span class="audio-val" id="p-audio">OFF</span>
            <span id="audio-meter"><span id="audio-meter-fill"></span></span>
          </span>
          <span class="stat stat-secondary" id="stat-size" title="Resolution">
            <span class="val" id="p-size">--</span>
          </span>
          <span class="stat stat-secondary" id="stat-latency" title="Latency">
            <span class="val" id="p-latency">--</span>
          </span>
          <span class="stat stat-secondary" id="stat-drop" title="Dropped frames">
            <span class="val" id="p-drop">--</span>
          </span>
        </div>
        <div class="player-right">
          <span id="p-publisher" class="status-pill status-live" title="Publisher status">PUB LIVE</span>
          <span id="p-ai" class="status-pill status-off" title="AI status">AI OFF</span>
          <select id="quality-select">
            <option value="high">High</option>
            <option value="medium">Med</option>
            <option value="low">Low</option>
            <option value="mini">Mini</option>
          </select>
          <button id="ptt-btn" class="ptt-button" title="Push to Talk">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
              <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
              <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
            </svg>
          </button>
        </div>
      </div>
    </div>
    <div class="player-canvas">
      <canvas id="liveCanvas"></canvas>
      <canvas id="overlayCanvas"></canvas>
      <div id="connectionOverlay" class="connection-overlay hidden">
        <div class="connection-spinner" id="connSpinner"></div>
        <div id="connStatus" class="connection-status">Connecting...</div>
        <div id="connDetail" class="connection-detail"></div>
      </div>
      <!-- AI Guidance Panel (right side overlay) -->
      <div id="guidancePanel" class="guidance-panel collapsed">
        <button id="guidanceToggle" class="guidance-toggle" title="AI Guidance">
          <span class="guidance-toggle-label">AI</span>
          <span id="guidanceStatusDot" class="guidance-status-dot" style="background:rgba(255,255,255,0.25)"></span>
        </button>
        <div id="guidanceContent" class="guidance-content">
          <div id="guidanceControl" class="guidance-section"></div>
          <div id="guidanceLog" class="guidance-section guidance-log"></div>
          <div id="guidanceTelemetry" class="guidance-section"></div>
        </div>
      </div>
    </div>
    <div id="toastContainer" class="toast-container"></div>
  </div>

  <!-- RECORDED VIDEO -->
  <div id="videoPlayer">
    <button class="close-btn" id="closeVideoBtn">&times;</button>
    <video id="recVideo" controls autoplay></video>
  </div>

  <!-- UNMUTE -->
  <div id="unmute">
    <div>
      <div class="icon">&#x1f50a;</div>
      <div class="text">Tap anywhere to enable audio</div>
    </div>
  </div>

</body>
</html>
