name: iOS CI/CD

on:
  push:
    branches: [dev, feat/*]
    paths:
      - 'publishers/CameraAccess/**'
      - '.github/workflows/ios-ci.yml'
  workflow_dispatch:
    inputs:
      upload_testflight:
        description: 'Upload to TestFlight'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

concurrency:
  group: ios-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  SCHEME: CameraAccess
  PROJECT: publishers/CameraAccess/CameraAccess.xcodeproj
  WORKSPACE: publishers/CameraAccess
  BUNDLE_ID: ebowwa.caringmind
  TEAM_ID: 42R8ZPM5N8

jobs:
  build-and-test:
    name: Build & Test
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Xcode and iOS Platform
        run: |
          sudo xcode-select -s /Applications/Xcode_16.3.app/Contents/Developer
          xcodebuild -version

          if ! xcrun simctl list runtimes | grep -q "iOS 18"; then
            echo "Downloading iOS simulator runtime..."
            xcodebuild -downloadPlatform iOS
          else
            echo "iOS 18 runtime already installed"
          fi

      - name: Build and Test
        run: |
          # Pick first available iPhone simulator (prefer iOS 18)
          DESTINATION=$(xcrun simctl list devices available -j | python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          for runtime, devs in sorted(data['devices'].items(), reverse=True):
              for d in devs:
                  if 'iPhone 16 Pro' in d['name'] and d['isAvailable'] and '18' in runtime:
                      print(d['udid']); sys.exit(0)
          for runtime, devs in sorted(data['devices'].items(), reverse=True):
              for d in devs:
                  if 'iPhone' in d['name'] and d['isAvailable']:
                      print(d['udid']); sys.exit(0)
          ")

          if [ -z "$DESTINATION" ]; then
            echo "ERROR: No iPhone simulator found"
            xcrun simctl list devices available
            exit 1
          fi

          echo "Using simulator UDID: $DESTINATION"

          xcodebuild build test \
            -project "${{ env.PROJECT }}" \
            -scheme "${{ env.SCHEME }}" \
            -destination "id=$DESTINATION" \
            -configuration Debug \
            -derivedDataPath build/DerivedData \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty --color || {
              echo "--- Raw xcodebuild output (last 100 lines) ---"
              tail -100 build/DerivedData/Logs/Test/*.xcresult
              exit 1
            }

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: build/DerivedData/Logs/
          retention-days: 7

  testflight:
    name: TestFlight Upload
    needs: build-and-test
    if: >
      (github.event_name == 'push' && (github.ref == 'refs/heads/dev' || startsWith(github.ref, 'refs/heads/feat/'))) ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.upload_testflight == 'true')
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Xcode and iOS Platform
        run: |
          sudo xcode-select -s /Applications/Xcode_16.3.app/Contents/Developer
          xcodebuild -version

          # Archive needs iOS device SDK, not simulator
          if ! xcodebuild -showsdks 2>/dev/null | grep -q "iphoneos"; then
            echo "Downloading iOS platform..."
            xcodebuild -downloadPlatform iOS
          else
            echo "iOS platform already installed"
          fi

      - name: Install signing certificate
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          CERT_PATH="$RUNNER_TEMP/certificate.p12"
          echo -n "$IOS_CERTIFICATE_BASE64" | base64 --decode -o "$CERT_PATH"
          security import "$CERT_PATH" \
            -P "$IOS_CERTIFICATE_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$KEYCHAIN_PATH"

          security set-key-partition-list \
            -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          security list-keychain -d user -s "$KEYCHAIN_PATH"

      - name: Install provisioning profile
        env:
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          PP_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PP_DIR"

          PP_PATH="$RUNNER_TEMP/profile.mobileprovision"
          echo -n "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode -o "$PP_PATH"

          PP_UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" /dev/stdin \
            <<< "$(security cms -D -i "$PP_PATH")")
          echo "PP_UUID=$PP_UUID" >> "$GITHUB_ENV"

          cp "$PP_PATH" "$PP_DIR/$PP_UUID.mobileprovision"
          echo "Installed profile: $PP_UUID"

      - name: Generate ExportOptions.plist
        run: |
          cat > publishers/CameraAccess/ExportOptions.plist << PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>teamID</key>
            <string>42R8ZPM5N8</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>ebowwa.caringmind</key>
              <string>${{ env.PP_UUID }}</string>
            </dict>
            <key>stripSwiftSymbols</key>
            <true/>
            <key>uploadBitcode</key>
            <false/>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          PLIST

      - name: Archive
        run: |
          set -o pipefail
          mkdir -p build

          ARCHIVE_PATH="$RUNNER_TEMP/CameraAccess.xcarchive"

          xcodebuild archive \
            -project "${{ env.PROJECT }}" \
            -scheme "${{ env.SCHEME }}" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$ARCHIVE_PATH" \
            -derivedDataPath build/DerivedData \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            DEVELOPMENT_TEAM="${{ env.TEAM_ID }}" \
            PROVISIONING_PROFILE_SPECIFIER="${{ env.PP_UUID }}"

          echo "ARCHIVE_PATH=$ARCHIVE_PATH" >> "$GITHUB_ENV"

      - name: Export IPA
        run: |
          EXPORT_PATH="$RUNNER_TEMP/export"
          mkdir -p "$EXPORT_PATH"

          xcodebuild -exportArchive \
            -archivePath "${{ env.ARCHIVE_PATH }}" \
            -exportPath "$EXPORT_PATH" \
            -exportOptionsPlist publishers/CameraAccess/ExportOptions.plist

          IPA_PATH=$(find "$EXPORT_PATH" -name "*.ipa" -print -quit)
          echo "IPA_PATH=$IPA_PATH" >> "$GITHUB_ENV"
          echo "Exported: $IPA_PATH"

      - name: Upload to TestFlight
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        run: |
          API_KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          echo -n "$APP_STORE_CONNECT_API_KEY_BASE64" | base64 --decode -o "$API_KEY_PATH"

          xcrun altool --upload-app \
            -t ios \
            -f "${{ env.IPA_PATH }}" \
            -u "" \
            -p "" \
            --apiKey "$APP_STORE_CONNECT_API_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"

          echo "Upload complete"

      - name: Build Summary
        if: always()
        run: |
          BUILD_NUM=$(git rev-list --count HEAD 2>/dev/null || echo "unknown")
          VERSION=$(git describe --tags --abbrev=0 2>/dev/null || echo "0.5.0")
          VERSION=${VERSION#v}

          echo "## iOS Build Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Field | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Version | \`${VERSION}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Build | \`${BUILD_NUM}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Branch | \`${{ github.ref_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Commit | \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Scheme | \`${{ env.SCHEME }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Configuration | Release |" >> "$GITHUB_STEP_SUMMARY"

      - name: Clean up keychain
        if: always()
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          if [ -f "$KEYCHAIN_PATH" ]; then
            security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true
          fi
          rm -f "$RUNNER_TEMP/certificate.p12" \
                "$RUNNER_TEMP/profile.mobileprovision" \
                "$RUNNER_TEMP/AuthKey.p8" \
                2>/dev/null || true
