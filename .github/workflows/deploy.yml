name: Deploy to VPS

on:
  push:
    branches: [feat/stream-registry]
    paths:
      - 'hosted/**'
      - '.github/workflows/deploy.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: relay.simulationapi.com
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 8m
          script: |
            set -euo pipefail

            cd /root/relay-server

            echo ">>> Pulling latest"
            cd /root/relay-server
            git checkout -- hosted/server/pkg/ 2>/dev/null || true
            git checkout -- hosted/web-platform/dist/ 2>/dev/null || true
            git clean -fd hosted/web-platform/dist/ 2>/dev/null || true
            git pull origin feat/stream-registry

            echo ">>> Updating version env vars"
            NEW_COMMIT=$(git rev-parse --short HEAD)
            NEW_VERSION="$(date +%Y%m%d-%H%M)"
            sed -i "s/^GIT_COMMIT=.*/GIT_COMMIT=$NEW_COMMIT/" hosted/server/.env
            sed -i "s/^BUILD_VERSION=.*/BUILD_VERSION=$NEW_VERSION/" hosted/server/.env
            echo "GIT_COMMIT=$NEW_COMMIT BUILD_VERSION=$NEW_VERSION"

            echo ">>> Installing build tools (idempotent)"
            apt-get install -y build-essential &>/dev/null || true

            echo ">>> Installing Rust toolchain (idempotent)"
            if ! command -v rustc &>/dev/null; then
              curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
              source "$HOME/.cargo/env"
            fi
            if ! command -v wasm-pack &>/dev/null; then
              curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
            fi
            source "$HOME/.cargo/env"

            echo ">>> Building WASM frame relay"
            cd /root/relay-server/hosted/packages/frame-relay-wasm
            wasm-pack build --target nodejs --out-dir ../../server/pkg
            echo "WASM rebuilt"

            echo ">>> Building relay-protocol if needed"
            cd /root/relay-server/hosted/packages/relay-protocol
            if [ ! -d dist ] || [ "$(find src -newer dist -type f 2>/dev/null | wc -l)" -gt 0 ]; then
              /root/.bun/bin/bun install
              /root/.bun/bin/bun x tsc
              echo "relay-protocol rebuilt"
            fi

            echo ">>> Building web platform"
            cd /root/relay-server/hosted/web-platform
            /root/.bun/bin/bun install
            /root/.bun/bin/bun x vite build
            echo "web-platform rebuilt"

            echo ">>> Installing server deps"
            cd /root/relay-server/hosted/server
            /root/.bun/bin/bun install

            echo ">>> Installing gateway deps"
            cd /root/relay-server/hosted/gateway
            /root/.bun/bin/bun install

            echo ">>> Syncing infra configs"
            cp /root/relay-server/hosted/infra/caringmind-relay.service /etc/systemd/system/
            cp /root/relay-server/hosted/infra/caringmind-gateway.service /etc/systemd/system/
            systemctl daemon-reload

            echo ">>> Checking Caddy config"
            if ! diff -q /root/relay-server/hosted/infra/Caddyfile /etc/caddy/Caddyfile >/dev/null 2>&1; then
              echo "Caddyfile changed — restarting Caddy"
              cp /root/relay-server/hosted/infra/Caddyfile /etc/caddy/
              systemctl restart caddy
              sleep 3
            else
              echo "Caddyfile unchanged — skipping Caddy restart"
            fi

            echo ">>> Stopping relay service and freeing port"
            systemctl stop caringmind-relay.service || true
            fuser -k 8080/tcp 2>/dev/null || true
            sleep 1

            echo ">>> Starting relay service"
            systemctl start caringmind-relay.service

            echo ">>> Waiting for relay startup"
            sleep 2

            echo ">>> Restarting gateway service"
            systemctl restart caringmind-gateway.service

            echo ">>> Waiting for gateway startup"
            sleep 2

            echo ">>> Health check (relay)"
            RELAY_HEALTH=$(curl -s http://localhost:8080/health)
            echo "Relay: $RELAY_HEALTH"
            WASM_LOADED=$(echo "$RELAY_HEALTH" | grep -o '"wasmLoaded":[a-z]*' | head -1)
            echo "WASM status: $WASM_LOADED"

            echo ">>> Health check (gateway)"
            for i in 1 2 3 4 5; do
              STATUS=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/health)
              if [ "$STATUS" = "200" ]; then
                echo "Gateway OK after attempt $i"
                break
              fi
              if [ "$i" = "5" ]; then
                echo "FAIL: gateway health check returned $STATUS after 5 attempts"
                systemctl status caringmind-gateway.service --no-pager
                exit 1
              fi
              echo "attempt $i: got $STATUS, retrying in 2s..."
              sleep 2
            done

            echo ">>> Deploy complete"
            systemctl status caringmind-relay.service --no-pager
            systemctl status caringmind-gateway.service --no-pager
