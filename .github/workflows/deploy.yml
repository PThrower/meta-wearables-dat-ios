name: Deploy to VPS

on:
  push:
    branches: [feat/stream-registry]
    paths:
      - 'hosted/**'
      - '.github/workflows/deploy.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: relay.simulationapi.com
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 3m
          script: |
            set -euo pipefail

            cd /root/relay-server

            echo ">>> Pulling latest"
            git pull origin feat/stream-registry

            echo ">>> Building relay-protocol if needed"
            cd hosted/packages/relay-protocol
            if [ ! -d dist ] || [ "$(find src -newer dist -type f 2>/dev/null | wc -l)" -gt 0 ]; then
              /root/.bun/bin/bun install
              /root/.bun/bin/bun x tsc
              echo "relay-protocol rebuilt"
            fi

            echo ">>> Building viewer if needed"
            cd /root/relay-server/hosted/viewer
            if [ ! -d dist ] || [ "$(find src index.html style.css -newer dist -type f 2>/dev/null | wc -l)" -gt 0 ]; then
              /root/.bun/bin/bun install
              /root/.bun/bin/bun x vite build
              echo "viewer rebuilt"
            fi

            echo ">>> Installing server deps if needed"
            cd /root/relay-server/hosted/server
            /root/.bun/bin/bun install

            echo ">>> Syncing infra configs"
            cp /root/relay-server/hosted/infra/caringmind-relay.service /etc/systemd/system/
            cp /root/relay-server/hosted/infra/Caddyfile /etc/caddy/
            systemctl daemon-reload

            echo ">>> Restarting service"
            systemctl restart caringmind-relay.service

            echo ">>> Waiting for startup"
            sleep 3

            echo ">>> Health check"
            STATUS=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/)
            if [ "$STATUS" != "200" ]; then
              echo "FAIL: health check returned $STATUS"
              systemctl status caringmind-relay.service --no-pager
              exit 1
            fi

            echo ">>> Deploy complete"
            systemctl status caringmind-relay.service --no-pager
